[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  from = "/local-marketing"
  to = "/insights/local-marketing/"
  status = 301

[[redirects]]
  from = "/local-marketing/"
  to = "/insights/local-marketing/"
  status = 301

[[redirects]]
  from = "/local"
  to = "/insights/local-marketing/"
  status = 301

[[redirects]]
  from = "/local/"
  to = "/insights/local-marketing/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://identity.netlify.com https://unpkg.com https://www.googletagmanager.com https://bzrcdn.openai.com https://*.hsforms.net https://*.hsforms.com https://*.hubspot.com https://*.hs-scripts.com https://*.hs-analytics.net https://*.hs-banner.com https://*.hsadspixel.net https://*.hubspotusercontent-na2.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://*.hsforms.net https://*.hsforms.com https://*.hubspot.com; font-src 'self' data: https://fonts.gstatic.com https://*.hsforms.net https://*.hsforms.com https://*.hubspot.com; img-src 'self' data: blob: https:; media-src 'self' data: blob:; connect-src 'self' https://identity.netlify.com https://api.netlify.com https://*.netlify.app https://www.google-analytics.com https://*.analytics.google.com https://*.g.doubleclick.net https://www.googletagmanager.com https://bzrcdn.openai.com https://*.openai.com https://*.hsforms.net https://*.hsforms.com https://*.hubspot.com https://*.hubapi.com https://*.hs-analytics.net https://*.hs-banner.com https://*.hsadspixel.net; frame-src 'self' https://app.netlify.com https://*.hsforms.net https://*.hsforms.com https://*.hubspot.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://*.netlify.app https://*.hsforms.com https://*.hubspot.com;"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
