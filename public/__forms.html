<!DOCTYPE html>
<html>
<head><title>Netlify form detection</title></head>
<body>
  <form name="contact" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="contact" />
    <input type="text" name="bot-field" />
    <input type="text" name="name" />
    <input type="email" name="email" />
    <textarea name="message"></textarea>
  </form>

  <form name="peak-season-lead" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="peak-season-lead" />
    <input type="text" name="bot-field" />
    <input type="text" name="name" />
    <input type="email" name="email" />
    <input type="text" name="company" />
    <input type="url" name="website" />
    <input type="text" name="monthly_ad_spend" />
    <input type="text" name="platforms" />
    <textarea name="q4_goal"></textarea>
  </form>
</body>
</html>
